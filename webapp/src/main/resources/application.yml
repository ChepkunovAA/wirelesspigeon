spring:
  application:
    name: corpsman
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${SPRING_DATASOURCE_USERNAME:app_user}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  cache:
    type: caffeine
  thymeleaf:
    cache: false

app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}

server:
  port: 8080
  servlet:
    session:
      timeout: 30m

logging:
  level:
    org.corpsman: DEBUG
    org.hibernate.SQL: INFO