spring:
  application:
    name: corpsman
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${SPRING_DATASOURCE_USERNAME:app_user}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  cache:
    type: caffeine
  thymeleaf:
    cache: false

app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  # Хранение времени: все LocalDateTime приложения — wall-clock UTC.
  # Отображение в шаблоне — UTC-фоллбэк (#temporals.format), фактическое
  # локальное время пользователя вычисляет time-format.js в браузере.
  time-zone: UTC

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

logging:
  level:
    org.corpsman: DEBUG
    org.hibernate.SQL: INFO