<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Уведомления — Corpsman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5" style="max-width: 720px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0"><i class="bi bi-bell"></i> Уведомления</h1>
        <form th:action="@{/notifications/read-all}" method="post"
              th:if="${unreadNotifications != null and unreadNotifications > 0}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-check2-all"></i> Отметить всё прочитанным
            </button>
        </form>
    </div>

    <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5 text-muted">
        <i class="bi bi-bell-slash fs-1 d-block mb-2 opacity-50"></i>
        Уведомлений пока нет
    </div>

    <div class="list-group shadow-sm" th:unless="${#lists.isEmpty(notifications)}">
        <form th:each="n : ${notifications}"
              th:action="@{/notifications/{id}/read(id=${n.id}, to=${n.url})}" method="post"
              class="list-group-item list-group-item-action text-start"
              th:classappend="${!n.read} ? 'bg-primary-subtle' : ''">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="d-flex justify-content-between align-items-start gap-2">
                <div class="flex-grow-1">
                    <span th:text="${n.text}">Текст уведомления</span>
                    <small class="text-muted d-block mt-1"
                           th:text="${#temporals.format(n.createdAt, 'dd.MM.yyyy HH:mm')}">дата</small>
                </div>
                <i class="bi bi-chevron-right text-muted" th:if="${n.url != null}"></i>
            </div>
        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
