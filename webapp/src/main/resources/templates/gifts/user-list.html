<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вишлист — Corpsman</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">
            <i class="bi bi-gift"></i> Вишлист
            <span class="text-secondary" th:text="'— ' + ${ownerName}">— user</span>
        </h1>
        <a th:href="@{/gifts/users}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Вишлисты</a>
    </div>

    <div th:if="${#lists.isEmpty(gifts)}" class="text-center py-5 text-muted">
        <i class="bi bi-gift" style="font-size: 3rem;"></i>
        <p class="mt-3 mb-0">Этот вишлист пока пуст.</p>
    </div>

    <div th:unless="${#lists.isEmpty(gifts)}" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
        <div class="col" th:each="gift : ${gifts}">
            <div class="card h-100 shadow-sm"
                 x-data="reservation()"
                 :class="reservedByMe ? 'border-primary bg-primary-subtle' : (limitReached ? 'border-secondary bg-secondary-subtle' : '')"
                 th:attr="data-gift-id=${gift.id},
                          data-reserved=${gift.reservedByMe},
                          data-limit-reached=${gift.limitReached},
                          data-reserved-count=${gift.reservedCount}">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${gift.title}">Подарок</h5>

                    <p th:if="${!#strings.isEmpty(gift.description)}" class="card-text text-muted"
                       th:text="${gift.description}">Описание</p>

                    <div class="mt-2 d-flex flex-wrap align-items-center gap-2">
                        <span class="badge text-bg-secondary">
                            <i class="bi bi-people"></i>
                            <span x-text="reservedCount" th:text="${gift.reservedCount}">0</span>
                            /
                            <span th:text="${gift.limit == 0 ? '∞' : gift.limit}">1</span>
                        </span>
                        <span th:if="${gift.limitReached}" class="badge text-bg-secondary">Лимит достигнут</span>
                    </div>

                    <div x-show="error" x-cloak class="alert alert-danger py-2 mt-2 mb-0" x-text="error"></div>

                    <div class="mt-auto pt-3">
                        <button type="button" class="btn btn-sm w-100"
                                :class="reservedByMe ? 'btn-danger' : 'btn-primary'"
                                :disabled="!reservedByMe && limitReached"
                                @click="toggle()">
                            <i class="bi" :class="reservedByMe ? 'bi-x-circle' : 'bi-bookmark-heart'"></i>
                            <span x-text="reservedByMe ? 'Отменить резерв' : (limitReached ? 'Лимит достигнут' : 'Зарезервировать')">
                                Зарезервировать
                            </span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
<script>
    document.addEventListener('alpine:init', () => {
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeaders = () => ({[csrfHeader]: csrfToken});

        Alpine.data('reservation', () => ({
            giftId: 0,
            reservedByMe: false,
            limitReached: false,
            reservedCount: 0,
            busy: false,
            error: '',
            init() {
                const el = this.$el;
                this.giftId = Number(el.dataset.giftId);
                this.reservedByMe = el.dataset.reserved === 'true';
                this.limitReached = el.dataset.limitReached === 'true';
                this.reservedCount = Number(el.dataset.reservedCount || 0);
            },
            async toggle() {
                if (this.busy) return;
                this.busy = true;
                this.error = '';
                const endpoint = this.reservedByMe
                    ? '/gifts/unreserve/' + this.giftId
                    : '/gifts/reserve/' + this.giftId;
                try {
                    const res = await fetch(endpoint, {method: 'POST', headers: csrfHeaders()});
                    if (!res.ok) {
                        const data = await res.json().catch(() => ({}));
                        this.error = data.error || 'Не удалось выполнить операцию';
                        return;
                    }
                    const data = await res.json();
                    this.reservedByMe = data.reservedByMe;
                    this.limitReached = data.limitReached;
                    this.reservedCount = data.newReservedCount;
                } finally {
                    this.busy = false;
                }
            }
        }));
    });
</script>
</body>
</html>
