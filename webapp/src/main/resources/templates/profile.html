<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Профиль — Corpsman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5" style="max-width: 640px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0"><i class="bi bi-person-circle"></i> Личный кабинет</h1>
        <a th:href="@{/settings}" class="btn btn-outline-secondary btn-sm" title="Настройки">
            <i class="bi bi-gear"></i> Настройки
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h5 class="card-title mb-3">Данные пользователя</h5>
            <dl class="row mb-0">
                <dt class="col-sm-4">Имя пользователя</dt>
                <dd class="col-sm-8"><span th:text="${user.username}">username</span></dd>

                <dt class="col-sm-4">Роль</dt>
                <dd class="col-sm-8">
                    <span class="badge" th:classappend="${user.role.name() == 'ADMIN'} ? 'text-bg-warning' : 'text-bg-secondary'"
                          th:text="${user.role.name()}">USER</span>
                </dd>

                <dt class="col-sm-4">Статус</dt>
                <dd class="col-sm-8">
                    <span th:if="${user.active}" class="badge text-bg-success">Активен</span>
                    <span th:unless="${user.active}" class="badge text-bg-danger">Заблокирован</span>
                </dd>
            </dl>
        </div>
    </div>

    <div class="card shadow-sm mt-3">
        <div class="card-body p-4" th:if="${forumRating != null}">
            <h5 class="card-title mb-3"><i class="bi bi-star-half"></i> Рейтинг</h5>
            <dl class="row align-items-center mb-0">
                <dt class="col-sm-4">Совокупный рейтинг</dt>
                <dd class="col-sm-8 mb-0">
                    <span class="fs-4 fw-bold"
                          th:classappend="${forumRating.receivedTotal >= 0} ? 'text-success' : 'text-danger'"
                          th:text="${forumRating.receivedTotal > 0 ? '+' : ''} + ${forumRating.receivedTotal}">0</span>
                    <span class="text-muted small ms-2">
                        <i class="bi bi-hand-thumbs-up"></i> <span th:text="${forumRating.receivedLikes}">0</span>
                        ·
                        <i class="bi bi-hand-thumbs-down"></i> <span th:text="${forumRating.receivedDislikes}">0</span>
                    </span>
                </dd>
                <dt class="col-sm-4 mt-2">Отдано реакций</dt>
                <dd class="col-sm-8 mt-2 text-muted mb-0"
                    th:text="${forumRating.givenLikes} + ' 👍 / ' + ${forumRating.givenDislikes} + ' 👎'">0</dd>
            </dl>
        </div>
    </div>

    <div class="card shadow-sm mt-3" th:if="${userFilmsStats != null}">
        <div class="card-body p-4">
            <h5 class="card-title mb-3"><i class="bi bi-film"></i> Кинотеатр</h5>
            <dl class="row mb-0">
                <dt class="col-sm-4">Средняя оценка фильмов</dt>
                <dd class="col-sm-8">
                    <span th:if="${userFilmsStats.totalVotes > 0}"
                          th:text="${#numbers.formatDecimal(userFilmsStats.average, 1, 1)} + ' ★'">—</span>
                    <span th:unless="${userFilmsStats.totalVotes > 0}" class="text-muted">—</span>
                </dd>
                <dt class="col-sm-4">Просмотрено ваших фильмов</dt>
                <dd class="col-sm-8" th:text="${userFilmsStats.totalVotes}">0</dd>

                <dt class="col-sm-4">Испорченность</dt>
                <dd class="col-sm-8">
                    <span th:if="${corruption != null}"
                          th:text="${#numbers.formatDecimal(corruption, 1, 1)}">—</span>
                    <span th:unless="${corruption != null}" class="text-muted">—</span>
                </dd>
            </dl>
        </div>
    </div>

    <div class="card shadow-sm mt-3" th:if="${myGifts != null && !myGifts.isEmpty()}">
        <div class="card-header">
            <h5 class="mb-0"><i class="bi bi-gift"></i> Мой вишлист</h5>
        </div>
        <div class="card-body p-4">
            <ul class="list-group list-group-flush mb-3">
                <li class="list-group-item d-flex justify-content-between align-items-center px-0" th:each="g : ${myGifts}">
                    <span th:text="${g.title}">Подарок</span>
                </li>
            </ul>
            <a th:href="@{/gifts}" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-gift"></i> Открыть мой вишлист
            </a>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-arrow-left"></i> На дашборд</a>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
