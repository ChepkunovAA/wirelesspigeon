<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/}">
            <img th:src="@{/assets/logo.png}" alt="Логотип Corpsman"
                 width="30" height="30"
                 class="rounded-circle border border-secondary-subtle me-2">
            Corpsman
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Меню">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto" sec:authorize="isAuthenticated()">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/cinema}"><i class="bi bi-film"></i> Кино</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/gifts}"><i class="bi bi-gift"></i> Подарки</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/forum}"><i class="bi bi-chat-dots"></i> Форум</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/users}"><i class="bi bi-people"></i> Участники</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/tokens}"><i class="bi bi-key"></i> Ключи</a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item me-3" sec:authorize="isAuthenticated()">
                    <a class="navbar-text text-decoration-none text-light" th:href="@{/profile}">
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="name">user</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn btn-outline-light btn-sm" type="submit">
                            <i class="bi bi-box-arrow-right"></i> Выйти
                        </button>
                    </form>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a th:href="@{/register}" class="btn btn-outline-light btn-sm me-2">
                        <i class="bi bi-person-plus"></i> Зарегистрироваться
                    </a>
                    <a th:href="@{/login}" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-in-right"></i> Войти
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main th:fragment="content" class="container pb-5">
    <div th:replace="~{::body}"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
</body>
</html>
