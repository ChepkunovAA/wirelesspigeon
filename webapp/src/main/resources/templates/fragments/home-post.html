<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="card(post)" class="card shadow-sm">
    <div class="card-body p-4" th:if="${post != null}">
        <h6 class="mb-1" th:text="${post.title}">Заголовок</h6>
        <p class="text-muted small mb-2">
            <span class="badge text-bg-light border" th:if="${post.anonymous}">Анонимно</span>
            <span th:if="${!post.anonymous}"
                  th:text="${post.authorName}">Автор</span>
            <span class="ms-2" th:if="${post.createdAt}"
                  th:text="${#temporals.format(post.createdAt, 'dd.MM.yyyy')}"></span>
        </p>
        <p class="mb-0 text-body-secondary" th:if="${post.firstPostPreview}"
           th:text="${#strings.abbreviate(post.firstPostPreview, 500)}"></p>
        <div th:if="${post.attachments != null and !post.attachments.isEmpty()}" class="mt-3">
            <div th:each="att : ${post.attachments}" class="d-inline-block me-2 mb-2">
                <img th:if="${att.contentType != null and att.contentType.startsWith('image/')}"
                     th:src="@{/forum/public/attachment/{id}(id=${att.id})}"
                     th:alt="${att.fileName}"
                     class="img-thumbnail" style="max-height:150px"/>
                <a th:unless="${att.contentType != null and att.contentType.startsWith('image/')}"
                   th:href="@{/forum/public/attachment/{id}(id=${att.id})}"
                   th:text="${att.fileName}" class="btn btn-sm btn-outline-primary"></a>
            </div>
        </div>
    </div>
    <div class="card-body p-4 text-center text-muted" th:if="${post == null}">
        <i class="bi bi-megaphone fs-2 d-block mb-2 opacity-50"></i>
        Постов пока нет — загляните позже
    </div>
</div>
</body>
</html>
