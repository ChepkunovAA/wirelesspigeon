<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Главная — Corpsman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5" style="max-width: 860px;">
    <header class="text-center py-5">
        <h1 class="display-5 fw-bold mb-3">Corpsman</h1>
        <p class="lead text-muted mb-0" sec:authorize="isAuthenticated()">
            Закрытый клуб: анонимный форум, вишлисты и кинотеатр
        </p>
        <p class="lead text-muted mb-4" sec:authorize="!isAuthenticated()">
            Закрытый клуб для своих. Вход — только по приглашению.
        </p>
    </header>

    <section class="mb-5">
        <p class="section-label mb-2"><i class="bi bi-trophy"></i> Лучший пост</p>
        <div th:replace="~{fragments/home-post :: card(post=${bestPost})}"></div>
    </section>

    <section>
        <p class="section-label mb-2"><i class="bi bi-megaphone"></i> Последний пост</p>
        <div th:replace="~{fragments/home-post :: card(post=${latestPost})}"></div>
    </section>
</main>

<footer class="border-top py-4 text-center text-muted small">
    Corpsman · закрытое сообщество
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
