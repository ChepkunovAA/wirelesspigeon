<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Настройки — Corpsman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5" style="max-width: 640px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0"><i class="bi bi-gear"></i> Настройки</h1>
        <a th:href="@{/profile}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Назад</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header d-flex align-items-center">
            <h5 class="mb-0"><i class="bi bi-person-circle"></i> Аватарка</h5>
        </div>
        <div class="card-body p-4">
            <div class="d-flex align-items-center gap-4 mb-3">
                <div class="avatar-preview" style="width: 100px; height: 100px; border-radius: 50%; overflow: hidden; background: var(--app-bg); border: 1px solid var(--app-border);">
                    <img th:if="${avatarPath != null}" th:src="@{'/uploads/' + ${avatarPath}}" 
                         class="img-fluid rounded-circle" style="width: 100%; height: 100%; object-fit: cover;" alt="Аватарка">
                    <div th:unless="${avatarPath != null}" class="d-flex align-items-center justify-content-center h-100">
                        <i class="bi bi-person-circle" style="font-size: 3rem; color: var(--app-text-muted);"></i>
                    </div>
                </div>
                <div>
                    <form th:action="@{/settings/avatar}" method="post" enctype="multipart/form-data" class="mb-2">
                        <input type="file" name="file" class="form-control form-control-sm" accept="image/jpeg,image/png,image/gif,image/webp" required>
                        <div class="form-text">JPEG, PNG, GIF, WebP до 2 МБ</div>
                        <button type="submit" class="btn btn-primary btn-sm mt-2 w-100"><i class="bi bi-upload"></i> Загрузить</button>
                    </form>
                    <form th:if="${avatarPath != null}" th:action="@{/settings/avatar/delete}" method="post" class="mt-2" onsubmit="return confirm('Удалить аватарку?');">
                        <button type="submit" class="btn btn-outline-danger btn-sm w-100"><i class="bi bi-trash"></i> Удалить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
            <form th:action="@{/settings/prefs}" method="post">
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="threadAnon" name="defaultThreadAnonymous"
                           th:checked="${settings.defaultThreadAnonymous}">
                    <label class="form-check-label" for="threadAnon">
                        Треды по умолчанию анонимные
                        <span class="d-block text-muted small">Новые треды будут создаваться анонимно</span>
                    </label>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="commentAnon" name="defaultCommentAnonymous"
                           th:checked="${settings.defaultCommentAnonymous}">
                    <label class="form-check-label" for="commentAnon">
                        Комментарии по умолчанию анонимные
                        <span class="d-block text-muted small">Новые комментарии будут публиковаться анонимно</span>
                    </label>
                </div>
                <div class="mb-3" sec:authorize="hasAnyRole('RESIDENT','MASTER')">
                    <label for="defaultVisibility" class="form-label">Видимость новых тредов по умолчанию</label>
                    <select id="defaultVisibility" name="defaultVisibility" class="form-select">
                        <option value="OPEN" th:selected="${settings.defaultVisibility == 'OPEN'}">
                            Открытый — виден всем пользователям</option>
                        <option value="GUEST" th:selected="${settings.defaultVisibility == 'GUEST'}">
                            Открытый — доступен гостям</option>
                        <option value="PUBLIC" th:selected="${settings.defaultVisibility == 'PUBLIC'}">
                            Публичный — виден всем и на главной</option>
                        <option value="CLOSED" th:selected="${settings.defaultVisibility == 'CLOSED'}">
                            Закрытый — только белый список</option>
                    </select>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="defaultReadOnly" name="defaultReadOnly"
                           th:checked="${settings.defaultReadOnly}">
                    <label class="form-check-label" for="defaultReadOnly">
                        По умолчанию только для чтения
                        <span class="d-block text-muted small">В новых тредах писать сможете только вы</span>
                    </label>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="showPublic" name="showPublicPosts"
                           th:checked="${settings.showPublicPosts}">
                    <label class="form-check-label" for="showPublic">
                        Показывать публичные посты
                        <span class="d-block text-muted small">Отключите, чтобы скрыть публичные треды из списка форума</span>
                    </label>
                </div>
                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" id="hideGuestThreads" name="hideGuestThreads"
                           th:checked="${settings.hideGuestThreads}">
                    <label class="form-check-label" for="hideGuestThreads">
                        Скрывать открытые треды, доступные гостям
                        <span class="d-block text-muted small">Такие треды не будут отображаться в списке форума</span>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary w-100">Сохранить настройки</button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">Смена пароля</div>
        <div class="card-body p-4">
            <form th:action="@{/settings/password}" method="post">
                <div class="mb-3">
                    <label for="oldPassword" class="form-label">Текущий пароль</label>
                    <input type="password" class="form-control" id="oldPassword" name="oldPassword" required>
                </div>
                <div class="mb-3">
                    <label for="newPassword" class="form-label">Новый пароль</label>
                    <input type="password" class="form-control" id="newPassword" name="newPassword" required
                           minlength="5" autocomplete="new-password">
                    <div class="form-text">Не менее 5 символов</div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Изменить пароль</button>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
