<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Настройки — Corpsman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5" style="max-width: 640px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0"><i class="bi bi-gear"></i> Настройки</h1>
        <a th:href="@{/profile}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Назад</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header">Настройки по умолчанию</div>
        <div class="card-body p-4">
            <form th:action="@{/settings/prefs}" method="post">
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="threadAnon" name="defaultThreadAnonymous"
                           th:checked="${settings.defaultThreadAnonymous}">
                    <label class="form-check-label" for="threadAnon">
                        Треды по умолчанию анонимные
                        <span class="d-block text-muted small">Новые треды будут создаваться анонимно</span>
                    </label>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="commentAnon" name="defaultCommentAnonymous"
                           th:checked="${settings.defaultCommentAnonymous}">
                    <label class="form-check-label" for="commentAnon">
                        Комментарии по умолчанию анонимные
                        <span class="d-block text-muted small">Новые комментарии будут публиковаться анонимно</span>
                    </label>
                </div>
                <div class="mb-3" sec:authorize="hasAnyRole('RESIDENT','MASTER')">
                    <label for="defaultVisibility" class="form-label">Видимость новых тредов по умолчанию</label>
                    <select id="defaultVisibility" name="defaultVisibility" class="form-select">
                        <option value="OPEN" th:selected="${settings.defaultVisibility == 'OPEN'}">
                            Открытый — виден всем пользователям</option>
                        <option value="PUBLIC" th:selected="${settings.defaultVisibility == 'PUBLIC'}">
                            Публичный — виден всем и на главной</option>
                        <option value="CLOSED" th:selected="${settings.defaultVisibility == 'CLOSED'}">
                            Закрытый — только белый список</option>
                    </select>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="defaultReadOnly" name="defaultReadOnly"
                           th:checked="${settings.defaultReadOnly}">
                    <label class="form-check-label" for="defaultReadOnly">
                        По умолчанию только для чтения
                        <span class="d-block text-muted small">В новых тредах писать сможете только вы</span>
                    </label>
                </div>
                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" id="showPublic" name="showPublicPosts"
                           th:checked="${settings.showPublicPosts}">
                    <label class="form-check-label" for="showPublic">
                        Показывать публичные посты
                        <span class="d-block text-muted small">Отключите, чтобы скрыть публичные треды из списка форума</span>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary w-100">Сохранить настройки</button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">Смена пароля</div>
        <div class="card-body p-4">
            <form th:action="@{/settings/password}" method="post">
                <div class="mb-3">
                    <label for="oldPassword" class="form-label">Текущий пароль</label>
                    <input type="password" class="form-control" id="oldPassword" name="oldPassword" required>
                </div>
                <div class="mb-3">
                    <label for="newPassword" class="form-label">Новый пароль</label>
                    <input type="password" class="form-control" id="newPassword" name="newPassword" required
                           minlength="5" autocomplete="new-password">
                    <div class="form-text">Не менее 5 символов</div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Изменить пароль</button>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
