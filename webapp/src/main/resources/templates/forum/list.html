<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Форум — Corpsman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0"><i class="bi bi-chat-dots"></i> Форум</h1>
        <a th:href="@{/forum/topic/create}" class="btn btn-primary btn-sm">
            <i class="bi bi-plus-lg"></i> Создать тред
        </a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
                <div class="d-flex gap-2 flex-wrap mb-3">
        <a th:href="@{/forum(search=${search})}"
           class="badge text-decoration-none p-2"
           th:classappend="${type == 'ALL'} ? 'text-bg-primary' : 'text-bg-light border text-dark'">Все</a>
        <a th:href="@{/forum(type='PUBLIC', search=${search})}"
           class="badge text-decoration-none p-2"
           th:classappend="${type == 'PUBLIC'} ? 'text-bg-primary' : 'text-bg-light border text-dark'">Публичные</a>
        <a th:href="@{/forum(type='GUEST', search=${search})}"
           class="badge text-decoration-none p-2"
           th:classappend="${type == 'GUEST'} ? 'text-bg-primary' : 'text-bg-light border text-dark'">Гостевые</a>
        <a th:href="@{/forum(type='OPEN', search=${search})}"
           class="badge text-decoration-none p-2"
           th:classappend="${type == 'OPEN'} ? 'text-bg-primary' : 'text-bg-light border text-dark'">Открытые</a>
        <a th:href="@{/forum(type='CLOSED', search=${search})}"
           class="badge text-decoration-none p-2"
           th:classappend="${type == 'CLOSED'} ? 'text-bg-primary' : 'text-bg-light border text-dark'">Закрытые</a>
    </div>

<form th:action="@{/forum}" method="get" class="row g-2 align-items-center">
                <div class="col-lg-8">
                    <input type="text" name="search" class="form-control" placeholder="Поиск по названию..."
                           th:value="${search}"/>
                </div>
                <div class="col-lg-3">
                    <select name="tag" class="form-select">
                        <option value="">Все теги</option>
                        <option th:each="t : ${tags}" th:value="${t.name}" th:selected="${t.name == selectedTag}"
                                th:text="${t.name + ' (' + t.count + ')'}">тег</option>
                    </select>
                </div>
                <div class="col-lg-1 d-grid">
                    <button class="btn btn-primary"><i class="bi bi-search"></i></button>
                </div>
            </form>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(page.content)}" class="text-center py-5 text-muted">
        <i class="bi bi-chat-dots" style="font-size: 3rem;"></i>
        <p class="mt-3 mb-1">Тредов пока нет.</p>
        <a th:href="@{/forum/topic/create}" class="btn btn-primary btn-sm">Создать первый тред</a>
    </div>

    <div class="list-group mb-4" th:unless="${#lists.isEmpty(page.content)}">
        <div th:each="topic : ${page.content}"
             th:classappend="${topic.visibility == 'CLOSED' and !topic.canInteract} ? 'closed-topic-row closed-for-admin'"
             class="list-group-item list-group-item-action">
            <div class="d-flex justify-content-between align-items-start gap-3">
                <div>
                    <div class="d-flex align-items-center flex-wrap gap-2">
                        <h5 class="mb-1">
                            <a th:href="@{/forum/topic/{id}(id=${topic.id})}"
                               class="stretched-link text-decoration-none" th:text="${topic.title}">Название треда</a>
                        </h5>
                        <span th:if="${topic.readOnly}" class="badge text-bg-secondary" title="Писать может только владелец">
                            <i class="bi bi-book"></i> Для чтения
                        </span>
                        <span th:if="${topic.visibility == 'CLOSED'}" class="badge text-bg-warning" title="Виден только белому списку">
                            <i class="bi bi-lock"></i> Закрытый
                        </span>
                        <span th:if="${topic.visibility == 'GUEST'}" class="badge text-bg-success" title="Гости могут писать и модерировать">
                            <i class="bi bi-people-fill"></i> Гостевой
                        </span>
                        <span th:if="${topic.visibility == 'PUBLIC'}" class="badge text-bg-info" title="Виден всем и на главной">
                            <i class="bi bi-megaphone"></i> Публичный
                        </span>
                        <span th:if="${topic.frozen}" class="badge text-bg-secondary" title="Тред заморожен">
                            <i class="bi bi-snow2"></i> Заморожен
                        </span>
                        <span th:each="tag : ${topic.tags}" class="badge text-bg-light border">
                            <i class="bi bi-tag"></i> <span th:text="${tag}">тег</span>
                        </span>
                    </div>
                    <p class="mb-1 text-muted small" th:text="${topic.firstPostPreview}">Превью</p>
                    <small class="text-muted">
                        <i class="bi bi-person"></i>
                        <a th:if="${!topic.anonymous and topic.authorId != null}"
                           th:href="@{/profile/{id}(id=${topic.authorId})}"
                           class="text-decoration-none position-relative z-2" th:text="${topic.authorName}">Автор</a>
                        <span th:if="${topic.anonymous}" th:text="${topic.authorName}">Автор</span>
                        &middot; <span th:text="${#temporals.format(topic.lastActivityAt, 'dd.MM.yyyy HH:mm')}">дата</span>
                    </small>
                    <small th:if="${topic.author}" class="text-success fw-bold ms-2">
                        <i class="bi bi-check-circle"></i> Ваш тред
                    </small>
                </div>
                <div class="text-end text-muted small flex-shrink-0 position-relative z-2">
                    <div><i class="bi bi-chat-text"></i> <span th:text="${topic.postsCount}">0</span></div>
                        <div title="Рейтинг треда">
                            <i class="bi bi-hand-thumbs-up"></i> <span th:text="${topic.likes}">0</span>
                            <i class="bi bi-hand-thumbs-down"></i> <span th:text="${topic.dislikes}">0</span>
                        </div>
                </div>
            </div>
        </div>
    </div>

    <nav th:if="${page.totalPages > 1}" aria-label="Пагинация">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page.number == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/forum(page=${page.number - 1}, search=${search}, tag=${selectedTag})}">&laquo;</a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/forum(page=${i}, search=${search}, tag=${selectedTag})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${page.number == page.totalPages - 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/forum(page=${page.number + 1}, search=${search}, tag=${selectedTag})}">&raquo;</a>
            </li>
        </ul>
    </nav>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
