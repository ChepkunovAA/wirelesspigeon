<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Настройка анкеты — ' + ${game.title}">Настройка анкеты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5" style="max-width: 760px;">
    <div class="mb-3">
        <a th:href="@{/rpg/games/{id}(id=${game.id})}" class="text-decoration-none small">
            <i class="bi bi-arrow-left"></i> К игре «<span th:text="${game.title}">игра</span>»
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">
            <i class="bi bi-sliders"></i> Настройка анкеты
            <span class="badge text-bg-secondary" th:text="${game.system.label()}">система</span>
        </div>
        <div class="card-body">
            <p class="text-muted small mb-3">
                Здесь задаются параметры листа персонажа для игры с кастомными правилами:
                числовые поля, текст и списки. Игроки увидят их в анкете в этом порядке.
            </p>
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Параметр</th>
                    <th>Тип</th>
                    <th class="text-end">Порядок</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(attributes)}">
                    <td colspan="3" class="text-muted small">Список пуст. Добавьте первый параметр ниже.</td>
                </tr>
                <tr th:each="a, s : ${attributes}">
                    <td th:text="${a.name}">Параметр</td>
                    <td><span class="badge text-bg-secondary" th:text="${a.type.name()}">TEXT</span></td>
                    <td class="d-flex gap-1">
                        <form th:action="@{/rpg/games/{gid}/attributes/{aid}/move(gid=${game.id}, aid=${a.id})}"
                              method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="direction" value="up"/>
                            <button class="btn btn-sm btn-outline-secondary"
                                    th:disabled="${s.first}" title="Выше">
                                <i class="bi bi-arrow-up"></i>
                            </button>
                        </form>
                        <form th:action="@{/rpg/games/{gid}/attributes/{aid}/move(gid=${game.id}, aid=${a.id})}"
                              method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="direction" value="down"/>
                            <button class="btn btn-sm btn-outline-secondary"
                                    th:disabled="${s.last}" title="Ниже">
                                <i class="bi bi-arrow-down"></i>
                            </button>
                        </form>
                        <form th:action="@{/rpg/games/{gid}/attributes/{aid}/delete(gid=${game.id}, aid=${a.id})}"
                              method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn btn-sm btn-outline-danger" title="Удалить">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card shadow-sm mt-4">
        <div class="card-header"><i class="bi bi-plus-lg"></i> Новый параметр</div>
        <div class="card-body">
            <form th:action="@{/rpg/games/{id}/attributes(id=${game.id})}" method="post" class="row g-2">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="col-md-6">
                    <label class="form-label">Название</label>
                    <input type="text" name="name" class="form-control" required maxlength="200"
                           placeholder="Например: Слава, Ремесло, Архетип...">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Тип</label>
                    <select name="attributeType" class="form-select">
                        <option value="TEXT">Текст</option>
                        <option value="NUMERIC">Число</option>
                        <option value="LIST">Список</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i> Добавить</button>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
