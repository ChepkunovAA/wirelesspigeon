<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${system.name} + ' — Corpsman'">Система</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5" style="max-width: 900px;">
    <div class="mb-3">
        <a th:href="@{/rpg/systems}" class="text-decoration-none small">
            <i class="bi bi-arrow-left"></i> К библиотеке систем
        </a>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1" th:text="${system.name}">Название системы</h1>
            <div class="d-flex gap-2 flex-wrap">
                <span class="badge" th:classappend="${system.isPublic} ? 'text-bg-success' : 'text-bg-secondary'" 
                    th:text="${system.isPublic} ? 'Публичная' : 'Приватная'">Публичная</span>
            </div>
        </div>
        <div class="d-flex gap-2">
            <!-- Форк доступен любому пользователю, кнопка не внутри блока автора. -->
            <a th:if="${currentUserId != null}"
               th:href="@{/rpg/systems/new(forkFrom=${system.id})}" class="btn btn-outline-info btn-sm">
                <i class="bi bi-files"></i> Форк
            </a>
            <div th:if="${isAuthor}" class="d-flex gap-2">
                <a th:href="@{/rpg/systems/{id}/edit(id=${system.id})}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-pencil"></i> Редактировать
                </a>
                <form th:action="@{/rpg/systems/{id}/delete(id=${system.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Удалить эту систему? Это действие нельзя отменить.')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-trash"></i> Удалить
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div th:if="${system.description != null and !system.description.isBlank()}" class="card shadow-sm mb-4">
        <div class="card-header"><i class="bi bi-file-text"></i> Описание</div>
        <div class="card-body">
            <p class="card-text mb-0" style="white-space: pre-wrap;" th:text="${system.description}">Описание</p>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <i class="bi bi-sliders"></i> Состав параметров листа
        </div>
        <div class="card-body">
            <div class="table-responsive" th:if="${!#lists.isEmpty(system.templateAttributes)}">
                <table class="table table-sm table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 50px;">№</th>
                            <th>Название</th>
                            <th style="width: 120px;">Тип</th>
                            <th style="width: 140px;">Вид списка</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="attr, stat : ${system.templateAttributes}">
                            <td th:text="${stat.count}">1</td>
                            <td class="fw-semibold" th:text="${attr.name}">Параметр</td>
                            <td>
                                <span class="badge text-bg-secondary" th:text="${attr.type}">TEXT</span>
                            </td>
                            <td>
                                <span th:if="${attr.type.name() == 'LIST'}" class="badge text-bg-info"
                                      th:text="${attr.listKind != null and attr.listKind.name() == 'COMPLEX'} ? 'Сложный' : 'Простой'">Простой</span>
                                <span th:unless="${attr.type.name() == 'LIST'}" class="text-muted small">—</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${#lists.isEmpty(system.templateAttributes)}" class="text-muted small">
                Состав не задан.
            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header d-flex align-items-center">
            <span><i class="bi bi-person-bounding-box"></i> Создание персонажа</span>
            <a th:href="@{/rpg/systems/{id}/character(id=${system.id})}"
               class="btn btn-outline-primary btn-sm ms-auto">
                <i class="bi bi-play"></i> Открыть режим создания
            </a>
        </div>
    </div>

    <div class="d-flex justify-content-between">
        <a th:href="@{/rpg/systems}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Назад к библиотеке
        </a>
        <a th:href="@{/rpg/games/new(system='CUSTOM', customSystemId=${system.id})}"
           class="btn btn-primary" th:if="${isAuthor}">
            <i class="bi bi-plus-lg"></i> Создать игру на этой системе
        </a>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
