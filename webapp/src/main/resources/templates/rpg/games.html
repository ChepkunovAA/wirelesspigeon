<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Игры — Corpsman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0"><i class="bi bi-dice-5"></i> Ролевые игры</h1>
        <div class="d-flex gap-2">
            <a th:if="${canCreate}" th:href="@{/rpg/systems}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-gear-wide-connected"></i> Системы
            </a>
            <a th:if="${canCreate}" th:href="@{/rpg/games/new}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg"></i> Создать игру
            </a>
        </div>
    </div>

    <form th:action="@{/rpg/games}" method="get" class="mb-3">
        <div class="input-group">
            <input type="text" name="search" class="form-control" placeholder="Поиск по названию..."
                   th:value="${search}" oninput="form.submit()">
            <button class="btn btn-outline-secondary" type="submit">
                <i class="bi bi-search"></i>
            </button>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(games)}" class="text-center py-5 text-muted">
        <i class="bi bi-dice-1 display-4 d-block mb-2"></i>
        Игр пока нет. Создайте первую!
    </div>

    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="game : ${games}">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title mb-1">
                        <a th:href="@{/rpg/games/{id}(id=${game.id})}" class="text-decoration-none"
                           th:text="${game.title}">Название</a>
                    </h5>
                    <div class="d-flex gap-2 align-items-center mb-2">
                        <span class="badge text-bg-secondary" th:text="${game.system.label()}">система</span>
                        <span class="badge text-bg-info" th:text="${game.visibility.label()}">видимость</span>
                        <span class="badge text-bg-success" th:if="${game.status.name() == 'RECRUITING'}"
                              th:text="${game.status.label()}">статус</span>
                        <span class="badge text-bg-primary" th:if="${game.status.name() == 'ACTIVE'}"
                              th:text="${game.status.label()}">статус</span>
                        <span class="badge text-bg-secondary" th:if="${game.status.name() == 'CLOSED'}"
                              th:text="${game.status.label()}">статус</span>
                    </div>
                    <p class="card-text text-muted small mb-2 flex-grow-1"
                       th:text="${#strings.abbreviate(game.description, 180)}">Описание</p>
                    <div class="d-flex justify-content-between align-items-center text-muted small">
                        <span><i class="bi bi-person"></i>
                            <a th:href="@{/profile/{id}(id=${game.masterId})}" class="text-decoration-none"
                               th:text="${game.masterName}">ведущий</a>
                        </span>
                        <span th:if="${game.participantCount > 0}">
                            <i class="bi bi-people"></i> <span th:text="${game.participantCount}">0</span>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
