<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Игры — Corpsman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0"><i class="bi bi-dice-5"></i> Ролевые игры</h1>
        <div class="d-flex gap-2">
            <a th:if="${canCreate}" th:href="@{/rpg/systems}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-gear-wide-connected"></i> Системы
            </a>
            <a th:if="${canCreate}" th:href="@{/rpg/games/new}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg"></i> Создать игру
            </a>
        </div>
    </div>

    <form th:action="@{/rpg/games}" method="get" class="mb-3">
        <div class="input-group">
            <input type="text" name="search" class="form-control" placeholder="Поиск по названию..."
                   th:value="${search}" oninput="form.submit()">
            <button class="btn btn-outline-secondary" type="submit">
                <i class="bi bi-search"></i>
            </button>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(myGames) and #lists.isEmpty(otherGames)}" class="text-center py-5 text-muted">
        <i class="bi bi-dice-1 display-4 d-block mb-2"></i>
        Игр пока нет. Создайте первую!
    </div>

    <!-- Мои игры: веду или участвую. Раздел всегда первый, поэтому свои игры
         видны на первой странице списка независимо от сортировки остальных. -->
    <h2 class="h5 mb-2" th:if="${!#lists.isEmpty(myGames)}">
        <i class="bi bi-person-gear"></i> Мои игры
    </h2>
    <div class="table-responsive mb-2" th:if="${!#lists.isEmpty(myGames)}" data-section="mine">
        <table class="table table-hover align-middle">
            <tbody>
            <tr th:each="game : ${myGames}" class="game-row"
                th:classappend="${game.status.name() == 'RECRUITING' ? 'game-row--recruiting' : (game.status.name() == 'ACTIVE' ? 'game-row--active' : 'game-row--closed')}"
                th:attr="data-game-row=${game.id}">
                <td class="fw-semibold">
                    <a th:href="@{/rpg/games/{id}(id=${game.id})}" class="text-decoration-none"
                       th:text="${game.title}">Название</a>
                    <div class="text-muted small" th:text="${#strings.abbreviate(game.description, 120)}">Описание</div>
                </td>
                <td class="text-muted small">
                    <i th:if="${game.mastered}" class="bi bi-person-gear" title="Веду"></i>
                    <i th:unless="${game.mastered}" class="bi bi-person-check" title="Участник"></i>
                    <a th:href="@{/profile/{id}(id=${game.masterId})}" class="text-decoration-none"
                       th:text="${game.masterName}">ведущий</a>
                </td>
                <td class="text-muted small" th:text="${game.status.label()}">статус</td>
                <td class="text-muted small text-end">
                    <i class="bi bi-people"></i> <span th:text="${game.participantCount}">0</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <nav th:if="${myPage != null and myPage.totalPages > 1}" class="mb-4" aria-label="Пагинация моих игр">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${myPage.number == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/rpg/games(myPage=${myPage.number - 1}, search=${search})}">&laquo;</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, myPage.totalPages - 1)}"
                th:classappend="${i == myPage.number} ? 'active'">
                <a class="page-link" th:href="@{/rpg/games(myPage=${i}, search=${search})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${myPage.number == myPage.totalPages - 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/rpg/games(myPage=${myPage.number + 1}, search=${search})}">&raquo;</a>
            </li>
        </ul>
    </nav>

    <!-- Остальные видимые игры -->
    <h2 class="h5 mb-2" th:if="${!#lists.isEmpty(otherGames)}">
        <i class="bi bi-dice-5"></i> Все игры
    </h2>
    <div class="table-responsive" th:if="${!#lists.isEmpty(otherGames)}" data-section="others">
        <table class="table table-hover align-middle">
            <tbody>
            <tr th:each="game : ${otherGames}" class="game-row"
                th:classappend="${game.status.name() == 'RECRUITING' ? 'game-row--recruiting' : (game.status.name() == 'ACTIVE' ? 'game-row--active' : 'game-row--closed')}"
                th:attr="data-game-row=${game.id}">
                <td class="fw-semibold">
                    <a th:href="@{/rpg/games/{id}(id=${game.id})}" class="text-decoration-none"
                       th:text="${game.title}">Название</a>
                    <div class="text-muted small" th:text="${#strings.abbreviate(game.description, 120)}">Описание</div>
                </td>
                <td class="text-muted small">
                    <i class="bi bi-person"></i>
                    <a th:href="@{/profile/{id}(id=${game.masterId})}" class="text-decoration-none"
                       th:text="${game.masterName}">ведущий</a>
                </td>
                <td class="text-muted small" th:text="${game.status.label()}">статус</td>
                <td class="text-muted small text-end">
                    <i class="bi bi-people"></i> <span th:text="${game.participantCount}">0</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${page != null and page.totalPages > 1}" class="mt-4" aria-label="Пагинация">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page.number == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/rpg/games(page=${page.number - 1}, search=${search})}">&laquo;</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link" th:href="@{/rpg/games(page=${i}, search=${search})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${page.number == page.totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/rpg/games(page=${page.number + 1}, search=${search})}">&raquo;</a>
            </li>
        </ul>
    </nav>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
