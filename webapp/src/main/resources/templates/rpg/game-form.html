<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${isEdit} ? 'Редактировать игру — Corpsman' : 'Новая игра — Corpsman'">Игра</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5" style="max-width: 760px;">
    <div class="mb-3">
        <a th:if="${isEdit}" th:href="@{/rpg/games/{id}(id=${gameId})}" class="text-decoration-none small">
            <i class="bi bi-arrow-left"></i> К игре
        </a>
        <a th:unless="${isEdit}" th:href="@{/rpg/games}" class="text-decoration-none small">
            <i class="bi bi-arrow-left"></i> К списку игр
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">
            <i class="bi bi-dice-5"></i>
            <span th:text="${isEdit} ? 'Редактировать игру' : 'Создать игру'">Создать игру</span>
        </div>
        <div class="card-body">
            <form th:action="${isEdit} ? @{/rpg/games/{id}/edit(id=${gameId})} : @{/rpg/games}"
                  method="post" th:object="${gameForm}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label">Название</label>
                    <input type="text" class="form-control" th:field="*{title}" required maxlength="200"
                           placeholder="Например: Поход в Подземелья Ветров">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}"
                         th:errors="*{title}">Ошибка</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Описание</label>
                    <textarea class="form-control" th:field="*{description}" rows="5" required
                              placeholder="Мир, правила, чем займутся игроки..."></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}"
                         th:errors="*{description}">Ошибка</div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Ролевая система</label>
                        <select class="form-select" th:field="*{system}" id="system-select">
                            <option th:each="s : ${systems}" th:value="${s.name()}" th:text="${s.label()}"></option>
                        </select>
                        <div class="form-text" th:if="${!isEdit}">
                            Систему нельзя полностью поменять после создания заявок.
                        </div>
                    </div>

                    <div class="col-md-6 d-none" id="custom-system-block">
                        <label class="form-label">Система из библиотеки</label>
                        <select class="form-select" th:field="*{customSystemId}">
                            <option value="">— выберите систему —</option>
                            <option th:each="sys : ${librarySystems}" th:value="${sys.id}" th:text="${sys.name}"></option>
                        </select>
                        <div th:if="${#lists.isEmpty(librarySystems)}" class="form-text">
                            В библиотеке пока нет систем —
                                <a th:href="@{/rpg/systems/new}">опубликуйте свою</a>.
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Статус</label>
                        <select class="form-select" th:field="*{status}">
                            <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.label()}"></option>
                        </select>
                    </div>
                </div>

                <div class="mb-3" th:attr="x-data=|{vis: '${gameForm.visibility}'}|">
                    <div class="mb-3" th:if="${isGuest}">
                        <label for="visibility" class="form-label">Тип доступа</label>
                        <select id="visibility" name="visibility" class="form-select" th:field="*{visibility}" x-model="vis">
                            <option value="GUEST">Открытый — виден всем пользователям</option>
                            <option value="CLOSED">Закрытый — только вы и белый список</option>
                        </select>
                    </div>

                    <div class="mb-3" th:unless="${isGuest}">
                        <label for="visibility" class="form-label">Видимость</label>
                        <select id="visibility" name="visibility" class="form-select" th:field="*{visibility}" x-model="vis">
                            <option value="OPEN">Открытый — виден всем пользователям</option>
                            <option value="PUBLIC">Публичный — виден всем и на главной</option>
                            <option value="CLOSED">Закрытый — только белый список</option>
                        </select>
                    </div>

                    <div class="form-check mb-3" th:unless="${isGuest}" x-show="vis === 'OPEN'" x-cloak>
                        <input class="form-check-input" type="checkbox" id="guestAccess" th:field="*{guestAccess}"/>
                        <label class="form-check-label" for="guestAccess">
                            <i class="bi bi-people-fill"></i> Доступен гостям
                            <span class="d-block text-muted small">Гости смогут писать и участвовать в этой игре</span>
                        </label>
                    </div>

                    <div class="mb-3 dropdown" x-show="vis === 'CLOSED'" x-cloak x-data="{ q: '' }">
                        <label class="form-label">Белый список</label>
                        <button class="btn btn-outline-secondary dropdown-toggle w-100" type="button"
                                data-bs-toggle="dropdown" data-bs-auto-close="outside">
                            Отметьте участников
                        </button>
                        <div class="dropdown-menu p-3 w-100" style="max-height: 280px; overflow: auto;">
                            <input type="text" x-model="q" class="form-control form-control-sm mb-2"
                                   placeholder="Поиск по нику..." autocomplete="off" aria-label="Поиск по нику">
                            <label class="dropdown-item-text form-check" th:each="u : ${allUsers}"
                                   th:attr="data-u=${u.username}"
                                   x-show="!q || $el.getAttribute('data-u').toLowerCase().includes(q.toLowerCase())">
                                <input type="checkbox" name="whitelistItems" th:value="${u.id}"
                                       class="form-check-input me-1"
                                       th:checked="${gameWhitelist != null and gameWhitelist.contains(u.id)}">
                                <span th:text="${u.username}">username</span>
                            </label>
                            <div th:if="${#lists.isEmpty(allUsers)}" class="text-muted small px-2">Нет других пользователей</div>
                        </div>
                        <div class="form-text">Игру будут видеть только вы и отмеченные пользователи</div>
                    </div>
                </div>

                <div class="form-check form-switch mb-3">
                    <!-- Снятая галочка не отправляется, а значение по умолчанию в
                         форме — true: без скрытого поля переключатель не работал бы. -->
                    <input type="hidden" name="attributesVisible" value="false"/>
                    <input class="form-check-input" type="checkbox" id="attributesVisible" th:field="*{attributesVisible}"/>
                    <label class="form-check-label" for="attributesVisible">
                        Игроки видят все параметры листа друг друга
                        <span class="d-block text-muted small">
                            Если выключено, участники видят в чужих анкетах только имя и квенту.
                            Ведущий и владелец листа видят всё.
                        </span>
                    </label>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="${isEdit} ? @{/rpg/games/{id}(id=${gameId})} : @{/rpg/games}"
                       class="btn btn-outline-secondary">Отмена</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i>
                        <span th:text="${isEdit} ? 'Сохранить' : 'Создать'">Создать</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        var select = document.getElementById('system-select');
        var block = document.getElementById('custom-system-block');
        if (!select || !block) return;
        function sync() {
            block.classList.toggle('d-none', select.value !== 'CUSTOM');
        }
        select.addEventListener('change', sync);
        sync();
    })();
</script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
</body>
</html>
