<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Библиотека ролевых систем — Corpsman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0"><i class="bi bi-gear-wide-connected"></i> Библиотека ролевых систем</h1>
        <a th:href="@{/rpg/systems/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Создать систему
        </a>
    </div>

    <div th:if="${systems.isEmpty()}" class="alert alert-info">
        <i class="bi bi-info-circle"></i> Библиотека систем пуста. Создайте первую систему, нажав кнопку выше.
    </div>

    <div th:unless="${systems.isEmpty()}" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div th:each="system : ${systems}" class="col">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${system.name}">Название системы</h5>
                    <p class="card-text text-muted small" th:text="${system.description}">Описание системы</p>
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge" th:classappend="${system.isPublic} ? 'text-bg-success' : 'text-bg-secondary'" 
                            th:text="${system.isPublic} ? 'Публичная' : 'Приватная'">Публичная</span>
                    </div>
                </div>
                <div class="card-footer bg-transparent border-top-0 d-flex flex-wrap justify-content-between gap-2">
                    <div class="d-flex flex-wrap gap-1">
                        <a th:href="@{/rpg/systems/{id}(id=${system.id})}" class="btn btn-outline-primary btn-sm"
                           title="Просмотр">
                            <i class="bi bi-eye"></i>
                        </a>
                        <!-- Форк доступен любому пользователю, поэтому кнопка не внутри блока автора. -->
                        <a th:if="${currentUserId != null}"
                           th:href="@{/rpg/systems/new(forkFrom=${system.id})}"
                           class="btn btn-outline-info btn-sm" title="Форк">
                            <i class="bi bi-files"></i>
                        </a>
                        <div th:if="${authorIds.contains(system.id)}" class="d-flex flex-wrap gap-1">
                            <a th:href="@{/rpg/systems/{id}/edit(id=${system.id})}"
                               class="btn btn-outline-secondary btn-sm" title="Редактировать">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/rpg/systems/{id}/delete(id=${system.id})}" method="post"
                                  onsubmit="return confirm('Удалить эту систему? Это действие нельзя отменить.')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-outline-danger btn-sm" title="Удалить">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/rpg/games}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> К играм
        </a>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
