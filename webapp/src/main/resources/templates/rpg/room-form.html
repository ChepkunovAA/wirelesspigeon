<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новая комната — Corpsman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5" style="max-width: 720px;">
    <div class="mb-3">
        <a th:href="@{/rpg/games/{id}(id=${game.id})}" class="text-decoration-none small">
            <i class="bi bi-arrow-left"></i> К игре «<span th:text="${game.title}">игра</span>»
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header"><i class="bi bi-door-open"></i> Новая комната</div>
        <div class="card-body">
            <form th:action="@{/rpg/games/{id}/rooms(id=${game.id})}" method="post" x-data="{ privateRoom: false }">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label">Название комнаты</label>
                    <input type="text" name="title" class="form-control" required maxlength="200"
                           placeholder="Например: Таверна «Разбитый щит»">
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox" name="privateRoom" class="form-check-input" id="privateRoom"
                           x-model="privateRoom">
                    <label class="form-check-label" for="privateRoom">
                        Приватная комната — только ведущему и отмеченным игрокам
                    </label>
                </div>

                <div class="mb-3 dropdown" x-show="privateRoom" x-cloak x-data="{ q: '' }">
                    <label class="form-label">Кто сможет войти</label>
                    <button type="button" class="btn btn-outline-secondary dropdown-toggle w-100"
                            data-bs-toggle="dropdown" data-bs-auto-close="outside">
                        Отметьте игроков
                    </button>
                    <div class="dropdown-menu p-3 w-100" style="max-height: 280px; overflow: auto;">
                        <input type="text" x-model="q" class="form-control form-control-sm mb-2"
                               placeholder="Поиск по нику..." autocomplete="off" aria-label="Поиск по нику">
                        <label class="dropdown-item-text form-check" th:each="p : ${playerSheets}"
                               th:attr="data-u=${p.ownerName}"
                               x-show="!q || $el.getAttribute('data-u').toLowerCase().includes(q.toLowerCase())">
                            <input type="checkbox" name="memberIds" th:value="${p.ownerId}"
                                   class="form-check-input me-1">
                            <span th:text="${p.ownerName}">игрок</span>
                        </label>
                        <div th:if="${#lists.isEmpty(playerSheets)}" class="text-muted small px-2">
                            Принятых игроков пока нет
                        </div>
                    </div>
                    <div class="form-text">Вы как ведущий всегда можете войти в приватную комнату</div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/rpg/games/{id}(id=${game.id})}" class="btn btn-outline-secondary">Отмена</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Создать</button>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
</body>
</html>
