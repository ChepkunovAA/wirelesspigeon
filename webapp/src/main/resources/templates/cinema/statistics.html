<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Статистика — Corpsman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0"><i class="bi bi-bar-chart"></i> Статистика</h1>
        <a th:href="@{/cinema}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Назад</a>
    </div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0"><i class="bi bi-trophy"></i> Топ лучших предлагающих</h4>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped align-middle mb-0">
                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Ник</th>
                                <th>Средняя оценка</th>
                                <th>Просмотрено фильмов</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="dto, i : ${bestProposers}">
                                <td th:text="${i.index + 1}">1</td>
                                <td><a th:href="@{/profile/{id}(id=${dto.userId})}" th:text="${dto.username}">username</a></td>
                                <td th:text="${#numbers.formatDecimal(dto.averageRating, 1, 1)} + ' ★'">7.5 ★</td>
                                <td th:text="${dto.watchedCount}">3</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(bestProposers)}">
                                <td colspan="4" class="text-center text-muted py-4">
                                    <i class="bi bi-inbox"></i> Статистика пока пуста
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0"><i class="bi bi-fire"></i> Топ испорченности предлагающих</h4>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped align-middle mb-0">
                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Ник</th>
                                <th>Испорченность</th>
                                <th>Просмотрено фильмов</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="dto, i : ${corruptionTop}">
                                <td th:text="${i.index + 1}">1</td>
                                <td><a th:href="@{/profile/{id}(id=${dto.userId})}" th:text="${dto.username}">username</a></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${dto.corruption < 1} ? 'text-bg-success' : (${dto.corruption < 3} ? 'text-bg-warning' : 'text-bg-danger')"
                                          th:text="${#numbers.formatDecimal(dto.corruption, 1, 1)}">2.0</span>
                                </td>
                                <td th:text="${dto.watchedCount}">3</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(corruptionTop)}">
                                <td colspan="4" class="text-center text-muted py-4">
                                    <i class="bi bi-inbox"></i> Статистика пока пуста
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
