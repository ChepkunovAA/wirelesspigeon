<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ключи — Corpsman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0"><i class="bi bi-key"></i> Ключи</h1>
        <form th:action="@{/keys/generate}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label class="form-check-label me-3 align-middle" th:if="${isMaster}">
                <input type="checkbox" name="guestKey" value="true" class="form-check-input me-1"/>
                Гостевой ключ
            </label>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Сгенерировать ключ
            </button>
        </form>
    </div>

    <div th:if="${rawToken}" class="alert alert-success" role="alert">
        <h6 class="alert-heading"><i class="bi bi-clipboard-check"></i> Новый ключ создан</h6>
        <p class="mb-1">Скопируйте ключ и передайте его новому участнику (будет показан один раз):</p>
        <div class="input-group">
            <input type="text" class="form-control font-monospace" th:value="${rawToken}" readonly id="rawToken">
            <button class="btn btn-outline-secondary" type="button" onclick="copyToken()">
                <i class="bi bi-copy"></i> Копировать
            </button>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Хэш ключа</th>
                    <th>Действует до</th>
                    <th>Статус</th>
                    <th>Создан администратором</th>
                    <th>Создан</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="token : ${tokens}" th:unless="${#lists.isEmpty(tokens)}">
                    <td th:text="${token.id}">1</td>
                    <td class="font-monospace text-muted">
                        <span th:text="${#strings.abbreviate(token.codeHash, 16)}">hash...</span>
                        <span th:if="${token.guestKey}" class="badge text-bg-info ms-1" title="Регистрирует пользователя с ролью Гость">гостевой</span>
                    </td>
                    <td th:text="${#temporals.format(token.expiresAt, 'dd.MM.yyyy HH:mm')}">01.01.2026 00:00</td>
                    <td>
                        <span th:if="${token.used}" class="badge text-bg-secondary">Использован</span>
                        <span th:unless="${token.used and token.expiresAt.isBefore(#temporals.createNow())}"
                              th:if="${token.expiresAt.isBefore(#temporals.createNow())}" class="badge text-bg-danger">Истёк</span>
                        <span th:if="${!token.used and !token.expiresAt.isBefore(#temporals.createNow())}"
                              class="badge text-bg-success">Активен</span>
                    </td>
                    <td th:text="${token.createdByUsername ?: '—'}">admin</td>
                    <td th:text="${#temporals.format(token.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026 00:00</td>
                </tr>
                <tr th:if="${#lists.isEmpty(tokens)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        <i class="bi bi-inbox"></i> Ключей пока нет
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function copyToken() {
        const input = document.getElementById('rawToken');
        input.select();
        navigator.clipboard.writeText(input.value).then(() => {
            const btn = event.target.closest('button');
            btn.innerHTML = '<i class="bi bi-check"></i> Скопировано';
        });
    }
</script>
</body>
</html>
