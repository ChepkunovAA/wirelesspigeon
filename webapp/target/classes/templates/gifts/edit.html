<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Редактировать подарок — Corpsman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5" style="max-width: 560px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0"><i class="bi bi-gift"></i> Редактировать подарок</h1>
        <a th:href="@{/gifts}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Назад</a>
    </div>

    <div th:if="${warning}" class="alert alert-warning">
        <p class="mb-1"><i class="bi bi-exclamation-triangle"></i> <span th:text="${warning}">Предупреждение</span></p>
        <p class="mb-0 small">При подтверждении сохранения лишние резервирования будут отменены — самые последние по времени.</p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form th:action="@{/gifts/edit/{id}(id=${gift.id})}" th:object="${gift}" method="post" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" th:field="*{id}"/>
                <input type="hidden" name="confirmExcess" th:value="${warning != null ? 'true' : 'false'}"/>

                <div class="mb-3">
                    <label for="title" class="form-label">Название *</label>
                    <input type="text" id="title" class="form-control"
                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" th:field="*{title}"
                           placeholder="Что вы хотели бы получить" required maxlength="200">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Описание</label>
                    <textarea id="description" rows="4" class="form-control"
                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'" th:field="*{description}"
                              placeholder="Детали, ссылки, размеры, цвет… (до 1000 символов)" maxlength="1000"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>

                <div class="mb-3">
                    <label for="limit" class="form-label">Сколько человек могут зарезервировать *</label>
                    <input type="number" id="limit" class="form-control" th:field="*{limit}" min="0"
                           th:classappend="${#fields.hasErrors('limit')} ? 'is-invalid'">
                    <div class="form-text">Укажите 0 — резервов может быть сколько угодно (без лимита).</div>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('limit')}" th:errors="*{limit}"></div>
                </div>

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger py-2">
                    <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Ошибка</p>
                </div>

                <button type="submit" class="btn btn-success w-100" th:classappend="${warning != null} ? 'btn-warning'">
                    <i class="bi bi-check-circle"></i>
                    <span th:text="${warning != null ? 'Сохранить, отменив лишние резервы' : 'Сохранить изменения'}">Сохранить</span>
                </button>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
