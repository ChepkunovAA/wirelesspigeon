<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вишлисты — Corpsman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0"><i class="bi bi-people"></i> Вишлисты</h1>
        <a th:href="@{/gifts}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Мой список</a>
    </div>

    <form th:action="@{/gifts/users}" method="get" class="row g-2 mb-4">
        <div class="col">
            <input type="text" name="search" class="form-control" placeholder="Поиск по нику…"
                   th:value="${search}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i> Найти</button>
        </div>
    </form>

    <div th:if="${users.totalElements == 0}" class="text-center py-5 text-muted">
        <i class="bi bi-search" style="font-size: 3rem;"></i>
        <p class="mt-3 mb-0" th:text="${#strings.isEmpty(search) ? 'Пока никто не добавил подарки в вишлист.' : 'Никого не найдено по запросу «' + search + '».'}">Пусто</p>
    </div>

    <div th:unless="${users.totalElements == 0}" class="table-responsive">
        <table class="table table-hover align-middle bg-white rounded shadow-sm">
            <thead class="table-light">
            <tr>
                <th>Пользователь</th>
                <th class="text-center">Подарков</th>
                <th class="text-end"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
<td>
                <a th:href="@{/profile/{id}(id=${user.userId})}" class="text-decoration-none">
                    <i class="bi bi-person-circle me-2 text-secondary"></i>
                    <span th:text="${user.username}">user</span>
                </a>
            </td>
                <td class="text-center">
                    <span class="badge text-bg-light border" th:text="${user.giftCount}">0</span>
                </td>
                <td class="text-end">
                    <a th:href="@{/gifts/user/{id}(id=${user.userId})}" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-gift"></i> Смотреть вишлист
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:replace="~{fragments/pagination :: pagination(page=${users}, baseUrl='/gifts/users', search=${search}, censorship='')}"
         th:if="${users.totalPages > 1}" aria-label="Пагинация"></nav>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
