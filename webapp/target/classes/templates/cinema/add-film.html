<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Предложить фильм — Corpsman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5" style="max-width: 560px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0"><i class="bi bi-film"></i> Предложить фильм</h1>
        <a th:href="@{/cinema}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Назад</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form th:action="@{/cinema/add}" th:object="${film}" method="post" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label for="title" class="form-label">Название *</label>
                    <input type="text" id="title" class="form-control"
                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" th:field="*{title}"
                           placeholder="Название фильма" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger py-2">
                    <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Ошибка</p>
                </div>

                <button type="submit" class="btn btn-success w-100">
                    <i class="bi bi-plus-circle"></i> Предложить фильм
                </button>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
