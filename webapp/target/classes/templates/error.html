<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ошибка — Corpsman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-sm" style="max-width: 460px; width: 100%;">
        <div class="card-body p-4 text-center">
            <i class="bi bi-exclamation-octagon fs-1 text-danger"></i>
            <h1 class="h4 mt-3 mb-2">
                Ошибка <span th:text="${status} ?: '500'">500</span>
            </h1>
            <p class="text-muted" th:text="${error?.message} ?: 'Внутренняя ошибка сервера'">
                Внутренняя ошибка сервера
            </p>
            <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-arrow-left"></i> На главную</a>
        </div>
    </div>
</div>
</body>
</html>
