<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Редактирование комментария — Corpsman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5" style="max-width: 800px;">
    <h1 class="h3 mb-4"><i class="bi bi-pencil"></i> Редактирование комментария</h1>

    <form th:action="@{/forum/post/{id}/edit(id=${postId})}" method="post" class="card shadow-sm">
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label" for="content">Текст</label>
                <textarea id="content" name="content" rows="5" class="form-control" required
                          th:text="${content}">Текст</textarea>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/forum/topic/{id}(id=${topicId})}" class="btn btn-outline-secondary">Отмена</a>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Сохранить</button>
            </div>
        </div>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
