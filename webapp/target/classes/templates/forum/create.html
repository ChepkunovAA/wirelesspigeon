<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Создать тред — Corpsman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container pb-5" style="max-width: 800px;">
    <h1 class="h3 mb-4"><i class="bi bi-plus-lg"></i> Создать тред</h1>

    <form th:action="@{/forum/topic/create}" th:object="${topic}" method="post"
          enctype="multipart/form-data" class="card shadow-sm">
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label" for="title">Заголовок</label>
                <input type="text" id="title" th:field="*{title}"
                       class="form-control" placeholder="Тема обсуждения"/>
                <div class="text-danger small" th:errors="*{title}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="content">Текст</label>
                <textarea id="content" th:field="*{content}" rows="6"
                          class="form-control" placeholder="О чём поговорим?"></textarea>
                <div class="text-danger small" th:errors="*{content}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="tags">Теги (через запятую)</label>
                <input type="text" id="tags" name="tags" class="form-control" placeholder="кино, юмор, важное"
                       list="allTagsList"/>
                <datalist id="allTagsList">
                    <option th:each="t : ${allTags}" th:value="${t}">тег</option>
                </datalist>
                <div class="form-text">Каждый тег не длиннее 50 символов.</div>
            </div>

            <div class="form-check mb-4">
                <input type="checkbox" id="anonymous" name="anonymous" th:field="*{anonymous}" class="form-check-input"/>
                <label class="form-check-label" for="anonymous">
                    <i class="bi bi-incognito"></i> Анонимный тред (ник автора скрыт)
                </label>
            </div>

            <div x-data="{vis: 'OPEN'}">
                <div class="mb-3" th:unless="${guestCreator}">
                    <label for="visibility" class="form-label">Видимость</label>
                    <select id="visibility" name="visibility" class="form-select"
                            th:field="*{visibility}" x-model="vis">
                        <option value="OPEN">Открытый — виден всем пользователям</option>
                        <option value="PUBLIC">Публичный — виден всем и на главной</option>
                        <option value="CLOSED">Закрытый — только белый список</option>
                    </select>
                    <div class="form-text">Для закрытых тредов отметьте белый список</div>
                </div>
                <div class="mb-3" th:if="${guestCreator}">
                    <label class="form-label">Видимость</label>
                    <input type="hidden" name="visibility" value="GUEST"/>
                    <div class="form-control-plaintext"><span class="badge text-bg-success">Гостевой</span></div>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="readOnly" name="readOnly"
                           th:field="*{readOnly}">
                    <label class="form-check-label" for="readOnly">
                        Только для чтения
                        <span class="d-block text-muted small">Никто, кроме вас, не сможет писать в этот тред</span>
                    </label>
                </div>
                <div class="mb-3 dropdown" x-show="vis === 'CLOSED'" x-cloak>
                    <label class="form-label">Белый список</label>
                    <button class="btn btn-outline-secondary dropdown-toggle w-100" type="button"
                            data-bs-toggle="dropdown" data-bs-auto-close="outside">
                        Отметьте участников
                    </button>
                    <div class="dropdown-menu p-3 w-100" style="max-height: 280px; overflow: auto;">
                        <label class="dropdown-item-text form-check" th:each="u : ${allUsers}">
                            <input type="checkbox" name="whitelistItems" th:value="${u.username}"
                                   class="form-check-input me-1">
                            <span th:text="${u.username}">username</span>
                        </label>
                        <div th:if="${#lists.isEmpty(allUsers)}" class="text-muted small px-2">Нет других пользователей</div>
                    </div>
                    <div class="form-text">Тред будут видеть только вы и отмеченные пользователи</div>
                </div>

            <div class="mb-4">
                <label class="form-label" for="files">Вложения (фото, видео или файлы)</label>
                <input type="file" id="files" name="files" multiple class="form-control"/>
                <div class="form-text">Фото и видео можно просматривать, остальные файлы — скачивать.</div>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/forum}" class="btn btn-outline-secondary">Отмена</a>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Создать</button>
            </div>
        </div>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
